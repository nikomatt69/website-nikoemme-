name = "nikoemme-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"

# Add your bindings here. Examples:
# [[kv_namespaces]]
# binding = "SESSION"
# id = "<your-kv-id>"
#
# [[d1_databases]]
# binding = "DB"
# database_name = "nikoemme"
# database_id = "<your-d1-id>"
#
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "nikoemme-assets"
